<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <!-- Night sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#051008"/>
      <stop offset="100%" stop-color="#0d2e12"/>
    </linearGradient>
    <radialGradient id="moon" cx="80%" cy="20%" r="15%">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="900" height="500" fill="url(#sky)"/>
  <rect width="900" height="500" fill="url(#moon)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="50" cy="40" r="1.2"/><circle cx="150" cy="80" r="0.8"/>
    <circle cx="250" cy="30" r="1"/><circle cx="380" cy="60" r="1.5"/>
    <circle cx="480" cy="20" r="0.9"/><circle cx="600" cy="50" r="1.2"/>
    <circle cx="720" cy="35" r="0.8"/><circle cx="820" cy="70" r="1"/>
    <circle cx="100" cy="120" r="0.7"/><circle cx="200" cy="100" r="1.1"/>
    <circle cx="540" cy="90" r="0.8"/><circle cx="660" cy="110" r="1"/>
    <circle cx="780" cy="95" r="1.3"/>
  </g>

  <!-- Distant mountains / hills -->
  <path d="M0 350 L80 200 L180 300 L280 160 L400 280 L520 180 L640 260 L760 150 L900 270 L900 500 L0 500Z"
        fill="#0a2210" opacity="0.8"/>

  <!-- Mid hills -->
  <path d="M0 400 L120 300 L240 360 L360 280 L480 340 L600 290 L720 350 L900 300 L900 500 L0 500Z"
        fill="#112b13" opacity="0.9"/>

  <!-- Foreground trees -->
  <!-- Tree 1 -->
  <rect x="60" y="370" width="10" height="80" fill="#1a3d1c"/>
  <polygon points="65,280 35,390 95,390" fill="#2e7d32"/>
  <polygon points="65,310 40,400 90,400" fill="#43a047"/>

  <!-- Tree 2 -->
  <rect x="140" y="380" width="8" height="70" fill="#1a3d1c"/>
  <polygon points="144,300 118,395 170,395" fill="#2e7d32"/>

  <!-- Tree 3 (big) -->
  <rect x="750" y="360" width="12" height="90" fill="#1a3d1c"/>
  <polygon points="756,260 720,375 792,375" fill="#1b5e20"/>
  <polygon points="756,295 724,385 788,385" fill="#2e7d32"/>

  <!-- Tree 4 -->
  <rect x="820" y="375" width="9" height="75" fill="#1a3d1c"/>
  <polygon points="824,305 800,388 848,388" fill="#2e7d32"/>

  <!-- Glowing orbs / fireflies -->
  <circle cx="300" cy="320" r="3" fill="#00c853" opacity="0.4"/>
  <circle cx="500" cy="280" r="2" fill="#00c853" opacity="0.3"/>
  <circle cx="650" cy="310" r="2.5" fill="#00c853" opacity="0.35"/>

  <!-- River / water reflection -->
  <ellipse cx="450" cy="460" rx="200" ry="20" fill="#0d3a18" opacity="0.5"/>
  <ellipse cx="450" cy="465" rx="120" ry="8" fill="#00c853" opacity="0.07"/>
</svg>
