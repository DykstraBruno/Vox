<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" fill="none">
  <defs>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="voxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#69f0ae"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- VOX lettering -->
  <text x="0" y="62" font-family="Arial Black, sans-serif" font-size="58"
        font-weight="900" fill="url(#voxGrad)" filter="url(#glow)"
        letter-spacing="-1">VOX</text>

  <!-- Leaf 1 (back, left) -->
  <path d="M152 10 C152 10 128 18 126 42 C124 58 136 66 148 58 C155 50 158 36 152 10Z"
        fill="url(#leafGrad1)" opacity="0.85"/>
  <!-- Leaf 2 (front, right) -->
  <path d="M162 6 C162 6 182 16 182 42 C182 58 168 66 158 56 C150 47 150 28 162 6Z"
        fill="url(#leafGrad2)"/>
  <!-- Leaf stem -->
  <line x1="154" y1="58" x2="150" y2="72" stroke="#00c853" stroke-width="2" stroke-linecap="round"/>

  <!-- "ambiental" text -->
  <text x="2" y="82" font-family="Arial, sans-serif" font-size="17"
        font-weight="400" fill="#69f0ae" letter-spacing="3.5">ambiental</text>

  <!-- tagline -->
  <text x="2" y="96" font-family="Arial, sans-serif" font-size="7.5"
        font-weight="400" fill="#a5d6a7" letter-spacing="1.2">COLETA E TRANSPORTE DE RESÍDUOS</text>
</svg>
