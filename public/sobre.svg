<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="560" height="480" rx="24" fill="url(#bg)"/>

  <!-- Sky / clouds -->
  <ellipse cx="120" cy="80" rx="70" ry="28" fill="white" opacity="0.7"/>
  <ellipse cx="160" cy="72" rx="50" ry="22" fill="white" opacity="0.8"/>
  <ellipse cx="420" cy="60" rx="80" ry="30" fill="white" opacity="0.65"/>
  <ellipse cx="460" cy="52" rx="55" ry="24" fill="white" opacity="0.75"/>

  <!-- Sun -->
  <circle cx="480" cy="90" r="36" fill="#fff9c4" opacity="0.9"/>
  <circle cx="480" cy="90" r="24" fill="#ffeb3b"/>

  <!-- Ground -->
  <rect x="0" y="340" width="560" height="140" rx="0" fill="url(#ground)"/>

  <!-- Big tree left -->
  <rect x="80" y="220" width="20" height="140" fill="#5d4037"/>
  <circle cx="90" cy="190" r="70" fill="#1b5e20"/>
  <circle cx="60" cy="220" r="45" fill="#2e7d32"/>
  <circle cx="120" cy="215" r="40" fill="#2e7d32"/>
  <circle cx="90" cy="160" r="50" fill="#43a047"/>

  <!-- Big tree right -->
  <rect x="440" y="240" width="16" height="120" fill="#5d4037"/>
  <circle cx="448" cy="210" r="60" fill="#1b5e20"/>
  <circle cx="420" cy="235" r="38" fill="#2e7d32"/>
  <circle cx="476" cy="230" r="35" fill="#2e7d32"/>
  <circle cx="448" cy="182" r="44" fill="#43a047"/>

  <!-- People / team silhouettes -->
  <!-- Person 1 -->
  <circle cx="220" cy="295" r="18" fill="#1565c0"/>
  <rect x="208" y="314" width="24" height="50" rx="8" fill="#1976d2"/>
  <rect x="200" y="318" width="12" height="36" rx="6" fill="#1976d2"/>
  <rect x="228" y="318" width="12" height="36" rx="6" fill="#1976d2"/>
  <rect x="212" y="358" width="10" height="30" rx="5" fill="#0d47a1"/>
  <rect x="226" y="358" width="10" height="30" rx="5" fill="#0d47a1"/>

  <!-- Person 2 (woman) -->
  <circle cx="290" cy="288" r="20" fill="#ef9a9a"/>
  <rect x="277" y="308" width="26" height="55" rx="8" fill="#e91e63"/>
  <rect x="268" y="312" width="13" height="38" rx="6" fill="#e91e63"/>
  <rect x="299" y="312" width="13" height="38" rx="6" fill="#e91e63"/>
  <rect x="281" y="358" width="10" height="30" rx="5" fill="#880e4f"/>
  <rect x="296" y="358" width="10" height="30" rx="5" fill="#880e4f"/>

  <!-- Person 3 -->
  <circle cx="360" cy="295" r="18" fill="#ffcc80"/>
  <rect x="348" y="314" width="24" height="50" rx="8" fill="#ff9800"/>
  <rect x="340" y="318" width="12" height="36" rx="6" fill="#ff9800"/>
  <rect x="368" y="318" width="12" height="36" rx="6" fill="#ff9800"/>
  <rect x="352" y="358" width="10" height="30" rx="5" fill="#e65100"/>
  <rect x="366" y="358" width="10" height="30" rx="5" fill="#e65100"/>

  <!-- Plant/seedling in hands -->
  <rect x="283" y="245" width="5" height="30" fill="#795548"/>
  <circle cx="285" cy="240" r="14" fill="#4caf50"/>
  <circle cx="278" cy="248" r="10" fill="#66bb6a"/>

  <!-- Clipboard -->
  <rect x="343" y="268" width="26" height="32" rx="3" fill="white" stroke="#bdbdbd" stroke-width="1.5"/>
  <rect x="350" y="264" width="12" height="8" rx="2" fill="#bdbdbd"/>
  <line x1="348" y1="278" x2="364" y2="278" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="348" y1="284" x2="364" y2="284" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="348" y1="290" x2="360" y2="290" stroke="#9e9e9e" stroke-width="1.5"/>

  <!-- Grass tufts -->
  <g fill="#388e3c">
    <ellipse cx="50" cy="342" rx="18" ry="6"/>
    <ellipse cx="150" cy="344" rx="14" ry="5"/>
    <ellipse cx="510" cy="342" rx="16" ry="6"/>
    <ellipse cx="400" cy="344" rx="12" ry="5"/>
    <ellipse cx="180" cy="341" rx="10" ry="4"/>
  </g>

  <!-- Flowers -->
  <circle cx="170" cy="338" r="5" fill="#ffeb3b"/>
  <circle cx="390" cy="340" r="4" fill="#f48fb1"/>
  <circle cx="500" cy="338" r="5" fill="#fff176"/>
</svg>
